name: control-plane

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cashtro/secret-scan start
      - run: pnpm --filter @cashtro/recon test
      - run: pnpm --filter @cashtro/adapters test
      - run: pnpm --filter @cashtro/sdk test
      - run: pnpm --filter @cashtro/api test
      - run: pnpm --filter @cashtro/onboard test
      - run: pnpm --filter @cashtro/mcp test
