# Optional local n8n. Not a paid cloud. Same machine as Voltron.
#   docker compose -f docker-compose.n8n.yml up -d
# Then N8N_BASE_URL=http://127.0.0.1:5678
# The control plane already falls back to Voltron when this is down.

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
